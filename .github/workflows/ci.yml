name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  testy:
    name: Testy
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Skonfiguruj PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, iconv, intl, pdo_sqlite, sqlite3, bcmath, zip
          coverage: none

      - name: Cache zaleznosci Composera
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Zainstaluj zaleznosci PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Przygotuj srodowisko
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Zbuduj zasoby frontendu
        run: |
          npm ci
          npm run build

      - name: Uruchom testy
        run: php artisan test
